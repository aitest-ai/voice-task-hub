name: Voice Job Contract Tests (No Inference)
on:
  pull_request:
    paths: ['experiments/voice-jobs/**', '.github/workflows/voice-jobs-tests.yml']
  push:
    branches: [main]
    paths: ['experiments/voice-jobs/**', '.github/workflows/voice-jobs-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s experiments/voice-jobs/tests -v
      - run: python3 -m compileall -q experiments/voice-jobs
# No secrets, models, real synthesis, publishing or self-hosted runners.
